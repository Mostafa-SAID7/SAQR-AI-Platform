name: Hotfix - Emergency Production Fixes

on:
  push:
    branches: [hotfix/**]

concurrency:
  group: hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-hotfix:
    name: Validate Hotfix Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate branch naming
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [[ ! "$BRANCH" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ Invalid hotfix branch name: $BRANCH"
            echo "Format required: hotfix/v<version> (e.g., hotfix/v1.0.1)"
            exit 1
          fi
          echo "✓ Hotfix branch name valid: $BRANCH"

  fast-track-ci:
    name: Fast-Track CI Pipeline
    runs-on: ubuntu-latest
    needs: validate-hotfix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run critical tests only
        run: npm test -- --run --reporter=verbose

      - name: Build production
        run: npm run build

      - name: Verify SSR server
        run: timeout 30 npm run serve:ssr:lead-gen-landing &
          sleep 5
          curl -f http://localhost:4000/ || exit 1

  security-hotfix-check:
    name: Security Check (Hotfix)
    runs-on: ubuntu-latest
    needs: validate-hotfix

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Quick security audit
        run: npm run audit:security:check || true

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          path: ./
          base: 'origin/main'
          head: HEAD
          extra_args: --debug

  hotfix-release:
    name: Create Hotfix Release
    runs-on: ubuntu-latest
    needs: [fast-track-ci, security-hotfix-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Extract and validate version from branch
        id: version
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION=${BRANCH#hotfix/}

          # Verify format
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✓ Version validated: $VERSION"

      - name: Create hotfix release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Update package.json with version (remove 'v' prefix for package.json)
          PACKAGE_VERSION=${VERSION#v}
          npm version $PACKAGE_VERSION --no-git-tag-version

          # Create git commit and tag
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "chore(hotfix): release $VERSION"

          # Create annotated tag with full version string
          git tag -a "$VERSION" -m "Hotfix Release $VERSION"
          git push origin "$VERSION"

          echo "✓ Hotfix release $VERSION created and tagged"

      - name: Notify hotfix completed
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## 🔥 Hotfix Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Ready for production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps**:" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify deployment" >> $GITHUB_STEP_SUMMARY
          echo "2. Create PR to backport to develop" >> $GITHUB_STEP_SUMMARY
          echo "3. Delete hotfix branch after merge" >> $GITHUB_STEP_SUMMARY

  hotfix-merge-reminder:
    name: Merge Hotfix to Develop
    runs-on: ubuntu-latest
    needs: hotfix-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')

    steps:
      - name: Create merge notification
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "## ⚠️ Hotfix Merge Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hotfix has been released to production. Now backport to develop:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Steps to Complete:" >> $GITHUB_STEP_SUMMARY
          echo "1. Create PR from \`$BRANCH\` to \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Request approval from team" >> $GITHUB_STEP_SUMMARY
          echo "3. Merge PR to develop" >> $GITHUB_STEP_SUMMARY
          echo "4. Delete hotfix branch: \`git push origin --delete $BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Why?** Ensures hotfix changes are available in develop for next release." >> $GITHUB_STEP_SUMMARY
