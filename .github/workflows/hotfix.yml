name: Hotfix - Emergency Production Fixes

on:
  push:
    branches: [hotfix/**]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-hotfix:
    name: Validate Hotfix Branch
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Validate branch naming
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [[ ! "$BRANCH" =~ ^hotfix/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ Invalid hotfix branch name: $BRANCH"
            echo "Format required: hotfix/v<version> (e.g., hotfix/v1.0.1)"
            exit 1
          fi
          echo "✓ Hotfix branch name valid: $BRANCH"

  fast-track-ci:
    name: Fast-Track CI Pipeline
    runs-on: ubuntu-latest
    needs: validate-hotfix
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run critical tests only
        run: npm test -- --run --reporter=verbose
      
      - name: Build production
        run: npm run build
      
      - name: Verify SSR server
        run: timeout 30 npm run serve:ssr:lead-gen-landing &
          sleep 5
          curl -f http://localhost:4000/ || exit 1

  security-hotfix-check:
    name: Security Check (Hotfix)
    runs-on: ubuntu-latest
    needs: validate-hotfix
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Quick security audit
        run: npm audit --audit-level=high || true
      
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: 'origin/main'
          head: HEAD
          extra_args: --debug

  hotfix-release:
    name: Create Hotfix Release
    runs-on: ubuntu-latest
    needs: [fast-track-ci, security-hotfix-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Install semantic-release
        run: npm install --save-dev semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/npm @semantic-release/github @semantic-release/git
      
      - name: Create hotfix release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION=${BRANCH#hotfix/}
          
          # Update package.json
          npm version $VERSION --no-git-tag-version
          
          # Create tag
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "chore(hotfix): release $VERSION"
          git tag -a $VERSION -m "Hotfix Release $VERSION"
          git push origin $VERSION
          
          echo "✓ Hotfix release $VERSION created and tagged"
      
      - name: Notify hotfix completed
        run: |
          echo "## 🔥 Hotfix Released" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Ready for production" >> $GITHUB_STEP_SUMMARY

  hotfix-merge-reminder:
    name: Merge Hotfix to Develop
    runs-on: ubuntu-latest
    needs: hotfix-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create merge notification
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "## ⚠️ Hotfix Merge Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "After hotfix is deployed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Create PR: \`$BRANCH\` → \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Get approval" >> $GITHUB_STEP_SUMMARY
          echo "3. Merge to develop" >> $GITHUB_STEP_SUMMARY
          echo "4. Delete hotfix branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This ensures hotfix is backported to develop branch." >> $GITHUB_STEP_SUMMARY
