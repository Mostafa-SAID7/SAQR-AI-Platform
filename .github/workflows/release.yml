name: Release - Semantic Versioning & GitHub Release

on:
  workflow_run:
    workflows: ['CI - Test & Build']
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    # Release job only runs after ci-test-build completes successfully

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify tag created
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "✓ Tag v${{ steps.version.outputs.version }} created successfully"
          else
            echo "⚠ No new tag created (no releasable commits)"
          fi
