name: Code Quality - TypeScript Strict & Secrets

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.html'
      - 'tsconfig*.json'
      - 'angular.json'
  push:
    branches: [main, develop]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.html'
      - 'tsconfig*.json'
      - 'angular.json'

# Note: This workflow is complementary to CI - Test & Build
# CI handles: format checks (Prettier), unit tests, build, package.json validation
# This workflow handles: TypeScript strict mode enforcement, template validation, secrets scanning

jobs:
  typescript-strict-check:
    name: TypeScript Strict Mode Enforcement
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      
      - name: Validate strict mode configuration
        run: |
          echo "Verifying TypeScript strict mode enforcement..."
          grep -q '"strict": true' tsconfig.json || (echo "❌ TypeScript strict mode not enabled!" && exit 1)
          grep -q '"noImplicitReturns": true' tsconfig.json || (echo "❌ noImplicitReturns not enforced!" && exit 1)
          grep -q '"noImplicitOverride": true' tsconfig.json || (echo "❌ noImplicitOverride not enforced!" && exit 1)
          echo "✓ All strict mode flags verified in tsconfig.json"
      
      - name: TypeScript compilation check
        run: npm run lint:ts:strict
      
      - name: Report on failure
        if: failure()
        run: |
          echo "## TypeScript Strict Mode Violations" >> $GITHUB_STEP_SUMMARY
          echo "Fix with: \`npx tsc --noEmit\` to see detailed errors" >> $GITHUB_STEP_SUMMARY

  template-validation:
    name: Angular Template Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      
      - name: Build with AOT template checking
        run: npm run lint:templates 2>&1 | tee template-check.log
      
      - name: Validate no template errors
        run: |
          if grep -q "error NG" template-check.log; then
            echo "❌ Angular template compilation errors found"
            grep "error NG" template-check.log
            exit 1
          fi
          if grep -q "ERROR in" template-check.log; then
            echo "❌ Build errors found"
            grep "ERROR in" template-check.log
            exit 1
          fi
          echo "✓ All templates validated successfully"

  secrets-scanning:
    name: Secrets & Credentials Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog - Scan PR changes
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug
      
      - name: TruffleHog - Scan push commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --debug
      
      - name: Skip on initial commit
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: echo "✓ Initial commit, skipping TruffleHog (no baseline)"
