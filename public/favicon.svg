      <stop stop-color="#182419"/>
      <stop offset="1" stop-color="#090d0a"/>
    </linearGradient>
    <linearGradient id="signal" x1="14" y1="17" x2="49" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6ff9a"/>
